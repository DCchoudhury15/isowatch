# Checks every push and pull request. The release workflow calls this file
# too (workflow_call), so a release is only built from a commit that passes
# all of these checks.
name: ci

on:
  push:
    # Branches only. A version tag runs release.yml, which calls this file.
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Format, vet, unit tests, examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Modules are tidy
        run: |
          for mod in $(git ls-files -- go.mod '*/go.mod'); do
            dir="$(dirname "$mod")"
            echo "go mod tidy -diff in $dir"
            (cd "$dir" && go mod tidy -diff)
          done
      - name: Vet
        run: |
          for mod in $(git ls-files -- go.mod '*/go.mod'); do
            dir="$(dirname "$mod")"
            echo "go vet in $dir"
            (cd "$dir" && go vet ./...)
          done
      - name: Unit tests (root module and processor)
        run: make test
      - name: Examples build
        run: cd examples/bank && go build ./...

  postgres:
    name: Tests with PostgreSQL 18
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: All tests, including real PostgreSQL 18
        run: make test-db TEST_DSN=postgres://postgres:postgres@localhost:5432/postgres

  collector:
    name: Collector build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Build the collector
        run: make collector
      - name: Check the example configs
        run: |
          ./collector/build/isowatch-collector validate --config collector/config.yaml
          ./collector/build/isowatch-collector validate --config collector/config.docker.yaml
          ./collector/build/isowatch-collector validate --config docker/collector-config.yaml
      - name: Alert rules
        run: make test-alerts
