# Runs when a version tag like v0.1.0 is pushed. See RELEASING.md.
#
# 1. check       scripts/check-release.sh: the processor's go.mod, CHANGELOG.md
#                and the processor tag are right, before anything is published
# 2. ci          all checks from ci.yml, including PostgreSQL 18 tests
# 3. binaries    the collector for linux and darwin, amd64 and arm64
# 4. image       ghcr.io/dcchoudhury15/isowatch-collector:<version> and :latest
# 5. release     a GitHub release with the binaries and notes from CHANGELOG.md
# 6. go-modules  installs the library and the processor from the public Go
#                proxy, the way a user would
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  COLLECTOR_IMAGE: ghcr.io/dcchoudhury15/isowatch-collector
  BUILDER_VERSION: v0.162.0

jobs:
  check:
    name: Ready to release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Versions, changelog and the processor tag
        run: scripts/check-release.sh "$GITHUB_REF_NAME" --remote

  ci:
    name: Tests
    needs: check
    uses: ./.github/workflows/ci.yml

  binaries:
    name: Collector binaries
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Generate the collector sources
        run: make collector VERSION="${GITHUB_REF_NAME#v}"
      - name: Build one archive per platform
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              name="isowatch-collector_${version}_${os}_${arch}"
              mkdir -p "dist/$name"
              (cd collector/build && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                go build -trimpath -ldflags="-s -w" -o "../../dist/$name/isowatch-collector" .)
              cp LICENSE collector/config.yaml "dist/$name/"
              tar -C dist -czf "dist/$name.tar.gz" "$name"
              rm -rf "dist/${name:?}"
            done
          done
          (cd dist && sha256sum ./*.tar.gz > checksums.txt)
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/
          if-no-files-found: error

  image:
    name: Collector image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # The Dockerfile cross-compiles, so no QEMU is needed for arm64.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.COLLECTOR_IMAGE }}
          # v0.1.0 gives :0.1.0 and :latest. A pre-release like v0.2.0-rc.1
          # gives only :0.2.0-rc.1.
          tags: |
            type=semver,pattern={{version}}
          flavor: |
            latest=auto
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/collector.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Placeholder for the isowatch-proxy image. Turn it on when
  # docker/proxy.Dockerfile exists, and add proxy-image to release.needs.
  #
  # proxy-image:
  #   name: Proxy image
  #   needs: ci
  #   runs-on: ubuntu-latest
  #   permissions:
  #     contents: read
  #     packages: write
  #   steps:
  #     - uses: actions/checkout@v7
  #     - uses: docker/setup-buildx-action@v4
  #     - uses: docker/login-action@v4
  #       with:
  #         registry: ghcr.io
  #         username: ${{ github.actor }}
  #         password: ${{ secrets.GITHUB_TOKEN }}
  #     - id: meta
  #       uses: docker/metadata-action@v6
  #       env:
  #         DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
  #       with:
  #         images: ghcr.io/dcchoudhury15/isowatch-proxy
  #         tags: |
  #           type=semver,pattern={{version}}
  #         flavor: |
  #           latest=auto
  #     - uses: docker/build-push-action@v7
  #       with:
  #         context: .
  #         file: docker/proxy.Dockerfile
  #         platforms: linux/amd64,linux/arm64
  #         push: true
  #         build-args: |
  #           VERSION=${{ steps.meta.outputs.version }}
  #           REVISION=${{ github.sha }}
  #         tags: ${{ steps.meta.outputs.tags }}
  #         labels: ${{ steps.meta.outputs.labels }}
  #         annotations: ${{ steps.meta.outputs.annotations }}

  release:
    name: GitHub release
    needs: [binaries, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Everything under "## [<version>]" up to the next "## [" heading,
          # without the "[x]: https://..." link lines at the end of the file.
          awk -v want="[$version]" '
            /^## \[/ { if (found) exit; if (index($0, want)) { found = 1; next } }
            /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > notes.md
          # Links in CHANGELOG.md are relative to the repository. Make them
          # absolute, so they also work on the release page.
          sed -i -E "s#\]\(([^):#][^):]*)\)#](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/\1)#g" notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version." > notes.md
          fi
          {
            echo
            echo "Collector image: \`docker pull $COLLECTOR_IMAGE:$version\`"
            echo
            echo "Go library: \`go get github.com/DCchoudhury15/isowatch@$GITHUB_REF_NAME\`"
            echo
            echo "Collector processor: \`github.com/DCchoudhury15/isowatch/processor/isowatchprocessor $GITHUB_REF_NAME\`"
          } >> notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "IsoWatch $GITHUB_REF_NAME" \
            --notes-file notes.md \
            "${flags[@]}"

  go-modules:
    name: Install from the Go proxy
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: go get the library and the processor, like a user would
        working-directory: ${{ runner.temp }}
        run: |
          mkdir user-app && cd user-app
          go mod init example.com/user-app
          cat > main.go <<'EOF'
          package main

          import (
          	"fmt"

          	"github.com/DCchoudhury15/isowatch/capture"
          	"github.com/DCchoudhury15/isowatch/processor/isowatchprocessor"
          )

          func main() {
          	fmt.Println(capture.Config{}.Tables, isowatchprocessor.NewFactory().Type())
          }
          EOF
          go get "github.com/DCchoudhury15/isowatch@$GITHUB_REF_NAME" \
            "github.com/DCchoudhury15/isowatch/processor/isowatchprocessor@$GITHUB_REF_NAME"
          go build ./...
          go list -m github.com/DCchoudhury15/isowatch github.com/DCchoudhury15/isowatch/processor/isowatchprocessor
      - name: Build a collector with ocb from the published processor
        working-directory: ${{ runner.temp }}
        run: |
          go install "go.opentelemetry.io/collector/cmd/builder@$BUILDER_VERSION"
          mkdir user-collector && cd user-collector
          cat > builder-config.yaml <<EOF
          dist:
            name: my-collector
            output_path: ./build
          receivers:
            - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver $BUILDER_VERSION
          processors:
            - gomod: github.com/DCchoudhury15/isowatch/processor/isowatchprocessor $GITHUB_REF_NAME
            - gomod: go.opentelemetry.io/collector/processor/batchprocessor $BUILDER_VERSION
          exporters:
            - gomod: go.opentelemetry.io/collector/exporter/debugexporter $BUILDER_VERSION
          EOF
          cat > config.yaml <<'EOF'
          receivers:
            otlp:
              protocols:
                http:
                  endpoint: 0.0.0.0:4318
          processors:
            isowatch:
              window: 2m
            batch: {}
          exporters:
            debug: {}
          service:
            pipelines:
              traces:
                receivers: [otlp]
                processors: [isowatch, batch]
                exporters: [debug]
          EOF
          CGO_ENABLED=0 "$(go env GOPATH)/bin/builder" --config=builder-config.yaml
          ./build/my-collector validate --config config.yaml
