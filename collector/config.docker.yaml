# Collector config used by docker-compose.yml. Anomalies go to Jaeger.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  isowatch:
    window: 2m
    group_by: transaction
    # The demo shows everything: one anomaly span per occurrence, and the
    # isowatch.txn spans in Jaeger. In production the defaults
    # (report: per_issue, drop_txn_spans: true) cost far fewer spans.
    report: every
    drop_txn_spans: false
  batch: {}

exporters:
  debug:
    verbosity: basic
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  telemetry:
    logs:
      sampling:
        enabled: false
  pipelines:
    traces:
      receivers: [otlp]
      processors: [isowatch, batch]
      exporters: [debug, otlp/jaeger]
